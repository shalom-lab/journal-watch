name: deploy:pages

# Auto on push to master (web/data); also manual.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/sync-data.mjs"
      - "packages/shared/**"
      - "data/**"
      - "config/**"
      - "prompts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install
      - run: pnpm --filter @journal-watch/shared build
      - name: Sync data into web public
        run: pnpm sync:data
      - run: pnpm --filter @journal-watch/web build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
