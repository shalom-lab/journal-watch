# AI relevance scores on raw entries → data/candidates.json
name: screen:title

on:
  workflow_dispatch:
    inputs:
      skip_commit:
        description: "Skip committing data/ back to the repo"
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_commit:
        description: "Skip committing data/ back to the repo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Do NOT set concurrency here: when called via workflow_call from pipeline,
# github.workflow resolves to the caller name and shared groups deadlock.

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      TITLE_BATCH_SIZE: ${{ vars.TITLE_BATCH_SIZE || '80' }}
      RELEVANCE_THRESHOLD: ${{ vars.RELEVANCE_THRESHOLD || '0.45' }}
      TITLE_KEEP_THRESHOLD: ${{ vars.TITLE_KEEP_THRESHOLD || '0.45' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm screen:title
      - name: Commit data
        if: ${{ inputs.skip_commit != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): screen:title $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
