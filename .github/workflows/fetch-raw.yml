# Pull latest journal entries → data/raw/
name: fetch:raw

on:
  workflow_dispatch:
    inputs:
      skip_commit:
        description: "Skip committing data/ back to the repo"
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_commit:
        description: "Skip committing data/ back to the repo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# No shared concurrency with pipeline — reusable workflow_call + same group = deadlock.
# Standalone dispatch still serializes on this workflow's own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || 'journal-watch@users.noreply.github.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm fetch:raw
      - name: Commit data
        if: ${{ inputs.skip_commit != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): fetch:raw $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
