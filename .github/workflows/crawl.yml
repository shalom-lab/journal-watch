name: Journal Watch Jobs

on:
  schedule:
    # Monthly on the 1st at 02:00 UTC → full pipeline (crawl + title)
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which step to run"
        type: choice
        required: true
        default: pipeline
        options:
          - pipeline
          - crawl
          - screen:title
          - prune:raw
      skip_commit:
        description: "Skip committing data/ back to the repo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: journal-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      TITLE_BATCH_SIZE: ${{ vars.TITLE_BATCH_SIZE || '80' }}
      RELEVANCE_THRESHOLD: ${{ vars.RELEVANCE_THRESHOLD || '0.45' }}
      TITLE_KEEP_THRESHOLD: ${{ vars.TITLE_KEEP_THRESHOLD || '0.45' }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || 'journal-watch@users.noreply.github.com' }}
      RAW_RETENTION_MONTHS: ${{ vars.RAW_RETENTION_MONTHS || '3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build shared
        run: pnpm --filter @journal-watch/shared build

      - name: Resolve job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "job=pipeline" >> "$GITHUB_OUTPUT"
          else
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Crawl
        if: ${{ steps.pick.outputs.job == 'crawl' || steps.pick.outputs.job == 'pipeline' }}
        run: pnpm crawl

      - name: Screen title
        if: ${{ steps.pick.outputs.job == 'screen:title' || steps.pick.outputs.job == 'pipeline' }}
        run: pnpm screen:title

      - name: Prune raw
        if: ${{ steps.pick.outputs.job == 'prune:raw' || steps.pick.outputs.job == 'pipeline' }}
        run: pnpm prune:raw

      - name: Commit data
        if: ${{ github.event_name == 'schedule' || inputs.skip_commit != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): ${{ steps.pick.outputs.job }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
